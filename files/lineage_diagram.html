<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHOO Controls Position – SQL Lineage Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%); border-bottom: 1px solid #30363d; padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.25rem; font-weight: 700; color: #f0f6fc; }
  header p  { font-size: 0.8rem; color: #8b949e; margin-top: 2px; }
  .badge { background: #1f6feb; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .legend { display: flex; gap: 20px; padding: 14px 32px; background: #161b22; border-bottom: 1px solid #21262d; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #8b949e; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .canvas-wrap { overflow: auto; padding: 32px; }
  svg { display: block; }
  .node-source   { fill: #1c2b3a; stroke: #388bfd; stroke-width: 1.5; }
  .node-step     { fill: #1a2a1a; stroke: #3fb950; stroke-width: 1.5; }
  .node-category { fill: #2b1d0e; stroke: #d29922; stroke-width: 1.5; }
  .node-summary  { fill: #2b1428; stroke: #bc8cff; stroke-width: 1.5; }
  .node-carry    { fill: #1f1f2e; stroke: #58a6ff; stroke-width: 1.5; }
  .node-break    { fill: #2b1515; stroke: #f85149; stroke-width: 1.5; }
  .node-label { font-size: 11px; font-weight: 600; fill: #f0f6fc; text-anchor: middle; dominant-baseline: central; }
  .node-sub   { font-size: 9px;  fill: #8b949e; text-anchor: middle; dominant-baseline: central; }
  .edge { fill: none; stroke-width: 1.5; }
  .section-label { font-size: 10px; font-weight: 700; fill: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
  .tooltip { position: fixed; display: none; background: #1c2128; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; font-size: 0.75rem; max-width: 320px; color: #c9d1d9; pointer-events: none; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.5); line-height: 1.5; }
  .tooltip strong { color: #f0f6fc; display: block; margin-bottom: 4px; }
  .node-group:hover rect { opacity: .85; cursor: pointer; filter: brightness(1.3); }
</style>
</head>
<body>
<header>
  <div>
    <div style="display:flex;align-items:center;gap:10px;">
      <h1>RHOO Controls Position — SQL Lineage Diagram</h1>
      <span class="badge">12 SQLs · 2 Pipelines</span>
    </div>
    <p>APP_REGHUB_RHOO_CONTROLS_POSITION · Olympus Regulatory Hub · Hover nodes for details</p>
  </div>
</header>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#388bfd;"></div>External Source Table</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950;"></div>Processing Step</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f85149;"></div>Break Assembly</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff;"></div>Carry Forward</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d29922;"></div>Category ID</div>
  <div class="legend-item"><div class="legend-dot" style="background:#bc8cff;"></div>Summary</div>
</div>
<div class="canvas-wrap">
<svg width="1420" height="900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a0" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5z" fill="#555"/></marker>
  <marker id="ab" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5z" fill="#388bfd"/></marker>
  <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5z" fill="#3fb950"/></marker>
  <marker id="ay" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5z" fill="#d29922"/></marker>
  <marker id="ap" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5z" fill="#bc8cff"/></marker>
  <marker id="ac" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5z" fill="#58a6ff"/></marker>
</defs>

<!-- ── SECTION LABELS ─────────────────────────────────────── -->
<text x="60"  y="28" class="section-label">External Sources</text>
<text x="290" y="28" class="section-label">Step 1–2 · Load &amp; Rank</text>
<text x="560" y="28" class="section-label">Step 3–4 · Break Assembly</text>
<text x="820" y="28" class="section-label">Step 5–7 · Select &amp; Carry-Forward</text>
<text x="200" y="498" class="section-label">Category ID Pipeline</text>
<text x="820" y="498" class="section-label">Summary Pipeline</text>

<!-- ── EXTERNAL SOURCE NODES (col 1) ────────────────────── -->
<!-- OM_LEDGER_ITEM_AUDIT_FACT_QRK -->
<g class="node-group" data-tip="Source fact table. Contains item-level open/matched position break data keyed by RECON_ID, INSTANCE_NAME, BREAK_STATUS, COB_DATE.">
  <rect x="20" y="46" width="200" height="54" rx="6" class="node-source"/>
  <text x="120" y="64"  class="node-label">OM_LEDGER_ITEM</text>
  <text x="120" y="78"  class="node-label">_AUDIT_FACT_QRK</text>
  <text x="120" y="92"  class="node-sub">GFOLYGRU_MANAGED</text>
</g>

<!-- CONTROLS_POSITION_REG_RAW -->
<g class="node-group" data-tip="Regulatory state raw source. Contains SLA timestamps, NOA action types, and state/sub-status per UITID.">
  <rect x="20" y="170" width="200" height="54" rx="6" class="node-source"/>
  <text x="120" y="188" class="node-label">CONTROLS_POSITION</text>
  <text x="120" y="202" class="node-label">_REG_RAW</text>
  <text x="120" y="216" class="node-sub">GFOLYREG_WORK</text>
</g>

<!-- Prior-day carry-forward store -->
<g class="node-group" data-tip="Prior-day carry-forward persistent store. Holds breaks from the previous business day not yet resolved. Fed back into STEP6 via anti-join.">
  <rect x="20" y="300" width="200" height="54" rx="6" class="node-carry"/>
  <text x="120" y="318" class="node-label">CONTROLS_POSITION</text>
  <text x="120" y="332" class="node-label">_CARRY_FORWARD</text>
  <text x="120" y="346" class="node-sub">GFOLYREG_WORK (prior day)</text>
</g>

<!-- ── STEP1 / STEP2 NODES (col 2) ───────────────────────── -->
<!-- STEP1-GRU -->
<g class="node-group" data-tip="STEP1-GRU: Reads open breaks from OM_LEDGER_ITEM_AUDIT_FACT_QRK. Applies DENSE_RANK by RECON_ID/COB_DATE/RECON_LOAD_ID to keep the latest load. Produces UITID, POSITION_ID, BREAK_TYPE, AGE_BUCKET.">
  <rect x="272" y="46" width="200" height="54" rx="6" class="node-step"/>
  <text x="372" y="64" class="node-label">STEP1 · GRU</text>
  <text x="372" y="78" class="node-sub">DENSE_RANK latest load</text>
  <text x="372" y="92" class="node-sub">OLYMPUS_REG / UITID / POSITION_ID</text>
</g>

<!-- STEP1-GRU_RESOLVED -->
<g class="node-group" data-tip="STEP1-GRU_RESOLVED: Flags UITIDs where BREAK_STATUS=RESOLVED using MAX window function, producing DUPLICATE_FLAG=Y/N for break category derivation in STEP3/4.">
  <rect x="272" y="124" width="200" height="54" rx="6" class="node-step"/>
  <text x="372" y="142" class="node-label">STEP1 · GRU_RESOLVED</text>
  <text x="372" y="156" class="node-sub">DUPLICATE_FLAG per UITID</text>
  <text x="372" y="168" class="node-sub">MAX window on BREAK_STATUS</text>
</g>

<!-- STEP2-REG -->
<g class="node-group" data-tip="STEP2-REG: Ranks regulatory state records per UITID by SLA timestamps (SLAKEYS_SEND_TS, KEYS_RIO_TS, DB_UPDATED_TS). Joins into break steps as REG_RANKING=1.">
  <rect x="272" y="202" width="200" height="54" rx="6" class="node-step"/>
  <text x="372" y="220" class="node-label">STEP2 · REG</text>
  <text x="372" y="234" class="node-sub">ROW_NUMBER by SLAKEYS_SEND_TS</text>
  <text x="372" y="248" class="node-sub">STATE_STATUS / NOA_ACTN_TYP</text>
</g>

<!-- ── BREAK ASSEMBLY NODES (col 3) ──────────────────────── -->
<!-- STEP3-LEFT_BREAK -->
<g class="node-group" data-tip="STEP3-LEFT_BREAK (Under-Reporting / OLYMPUS): Joins GRU + REG + GRU_RESOLVED where BREAK_TYPE=OLYMPUS and BREAK_STATUS=OPEN. Ranks breaks by 18-tier priority ordering. Computes LATEST_ACK_*_TS windows.">
  <rect x="544" y="70" width="200" height="76" rx="6" class="node-break"/>
  <text x="644" y="90"  class="node-label">STEP3 · LEFT_BREAK</text>
  <text x="644" y="106" class="node-sub">OLYMPUS → Under-Reporting</text>
  <text x="644" y="120" class="node-sub">GRU ⋈ REG ⋈ GRU_RESOLVED</text>
  <text x="644" y="134" class="node-sub">18-tier BREAK_RANKING</text>
</g>

<!-- STEP4-RIGHT_BREAK -->
<g class="node-group" data-tip="STEP4-RIGHT_BREAK (Over-Reporting / DTCC): Same join pattern as STEP3 but for BREAK_TYPE=DTCC. Additionally derives BREAK_CATEGORY (DUPLICATE-TRADE, TERM_ACKED, PENDING_NACK_RESOLUTION, etc.).">
  <rect x="544" y="200" width="200" height="76" rx="6" class="node-break"/>
  <text x="644" y="220" class="node-label">STEP4 · RIGHT_BREAK</text>
  <text x="644" y="236" class="node-sub">DTCC → Over-Reporting</text>
  <text x="644" y="252" class="node-sub">GRU ⋈ REG ⋈ GRU_RESOLVED</text>
  <text x="644" y="266" class="node-sub">BREAK_CATEGORY derivation</text>
</g>

<!-- ── SELECT + CARRY NODES (col 4) ──────────────────────── -->
<!-- STEP5-SELECT -->
<g class="node-group" data-tip="STEP5-SELECT: UNION ALL of STEP3 (UNDER_REPORTING) and STEP4 (OVER_REPORTING), filtered to BREAK_RANKING=1. Normalises column structure: REPORTING_TYPE, SLAKEYS_SEND_TS cast to STRING.">
  <rect x="820" y="120" width="200" height="66" rx="6" class="node-step"/>
  <text x="920" y="140" class="node-label">STEP5 · SELECT</text>
  <text x="920" y="156" class="node-sub">UNION ALL Left + Right Breaks</text>
  <text x="920" y="170" class="node-sub">BREAK_RANKING=1 · normalised cols</text>
  <text x="920" y="182" class="node-sub">REPORTING_TYPE unified</text>
</g>

<!-- STEP6-CARRY_FORWARD -->
<g class="node-group" data-tip="STEP6-CARRY_FORWARD: Merges today's STEP5 breaks with prior-day carried-forward breaks using UNION ALL + anti-join (LEFT JOIN WHERE CUR.POSITION_ID IS NULL). Adds RECORD_SOURCE flag.">
  <rect x="820" y="240" width="200" height="66" rx="6" class="node-carry"/>
  <text x="920" y="260" class="node-label">STEP6 · CARRY_FORWARD</text>
  <text x="920" y="276" class="node-sub">STEP5 UNION prior-day store</text>
  <text x="920" y="292" class="node-sub">RECORD_SOURCE: CURRENT/CF</text>
  <text x="920" y="305" class="node-sub">Anti-join on POSITION_ID</text>
</g>

<!-- STEP7-CARRY_FORWARD (persist) -->
<g class="node-group" data-tip="STEP7-CARRY_FORWARD: INSERT OVERWRITE into the carry-forward persistent store. Ensures the next business day's STEP6 can pull prior-day breaks. Filtered by RECON_ID parameter.">
  <rect x="820" y="360" width="200" height="54" rx="6" class="node-carry"/>
  <text x="920" y="378" class="node-label">STEP7 · CARRY_FORWARD</text>
  <text x="920" y="394" class="node-sub">INSERT OVERWRITE → store</text>
  <text x="920" y="406" class="node-sub">Persists for next business day</text>
</g>

<!-- ── CATEGORY ID NODES ───────────────────────────────── -->
<!-- CFTC_CATEGORY_ID -->
<g class="node-group" data-tip="APP_REGHUB_RHOO_CONTROLS_POSITION_CFTC_CATEGORY_ID: Simple distinct lookup. Fetches RECON_ID + REPLACE(COMMENTS,',',';') for open OLYMPUS/DTCC breaks. Used as join key in Summary pipeline.">
  <rect x="180" y="524" width="200" height="54" rx="6" class="node-category"/>
  <text x="280" y="542" class="node-label">CFTC_CATEGORY_ID</text>
  <text x="280" y="558" class="node-sub">Distinct COMMENTS per position</text>
  <text x="280" y="570" class="node-sub">REPLACE(',',';') cleanup</text>
</g>

<!-- CFTC_CATEGORY_ID_DETAILS -->
<g class="node-group" data-tip="APP_REGHUB_RHOO_CONTROLS_POSITION_CFTC_CATEGORY_ID_DETAILS: Builds sha2(COMMENTS,512) as CATEGORY_ID_HASH. Five asset-class CTEs (FX 9771338 / IR 9777334 / Equities 9776729 / Credit 9774339 / Commodities 9774339) each mapping ITEM_CURRENCY_* to ckeys/cstate namespace. UNIONed WHERE LTO=1.">
  <rect x="450" y="514" width="210" height="86" rx="6" class="node-category"/>
  <text x="555" y="532" class="node-label">CFTC_CATEGORY_ID_DETAILS</text>
  <text x="555" y="548" class="node-sub">sha2(COMMENTS,512) → CATEGORY_ID_HASH</text>
  <text x="555" y="562" class="node-sub">5 CTEs: FX · IR · Equities</text>
  <text x="555" y="576" class="node-sub">Credit · Commodities</text>
  <text x="555" y="590" class="node-sub">UNION ALL WHERE LTO=1</text>
</g>

<!-- ── SUMMARY NODES ───────────────────────────────────── -->
<!-- STEP1-SUMMARY -->
<g class="node-group" data-tip="STEP1-SUMMARY: Reads OM_LEDGER for OPEN+MATCHED breaks. LEFT JOINs CFTC_CATEGORY_ID to set CATEGORY_FLAG (TRUE/FALSE). Ranks by COB_DATE/RECON_LOAD_ID. Handles PROVINCE_ID for CAD region.">
  <rect x="820" y="524" width="200" height="76" rx="6" class="node-summary"/>
  <text x="920" y="542" class="node-label">STEP1 · SUMMARY</text>
  <text x="920" y="558" class="node-sub">OM_LEDGER + CFTC_CATEGORY_ID join</text>
  <text x="920" y="572" class="node-sub">CATEGORY_FLAG · LOAD_RANK</text>
  <text x="920" y="586" class="node-sub">OPEN + MATCHED breaks</text>
  <text x="920" y="598" class="node-sub">PROVINCE_ID (CAD logic)</text>
</g>

<!-- STEP2-SUMMARY_SELECT -->
<g class="node-group" data-tip="STEP2-SUMMARY_SELECT: Aggregates STEP1-SUMMARY to COUNT(*) per dimensional group (RECON_TYPE, COB_DATE, ASSET, COUNTERPARTY1, BREAK_TYPE, REPORTING_TYPE, PROVINCE_ID, ACTIVE_FLAG, CATEGORY_FLAG). Filters LOAD_RANK=1, excludes MATCHED except OVER_REPORTING.">
  <rect x="820" y="666" width="200" height="66" rx="6" class="node-summary"/>
  <text x="920" y="684" class="node-label">STEP2 · SUMMARY_SELECT</text>
  <text x="920" y="700" class="node-sub">GROUP BY 9 dimensions</text>
  <text x="920" y="716" class="node-sub">COUNT(*) AS SUMMARY_COUNT</text>
  <text x="920" y="730" class="node-sub">LOAD_RANK=1 filter</text>
</g>

<!-- OM_LEDGER → CFTC_CATEGORY_ID_DETAILS (yellow) -->

<text x="800" y="104" style="font-size:9px;fill:#30363d;font-weight:700;">Carry-Forward Pipeline</text>

</svg>
</div>

<div class="tooltip" id="tt"></div>
<script>
const tt = document.getElementById('tt');
document.querySelectorAll('.node-group').forEach(el => {
  const tip = el.getAttribute('data-tip');
  if (!tip) return;
  el.addEventListener('mousemove', e => {
    tt.style.display = 'block';
    const name = el.querySelector('.node-label')?.textContent || '';
    tt.innerHTML = '<strong>' + name + '</strong>' + tip;
    tt.style.left = Math.min(e.clientX+14, window.innerWidth-340) + 'px';
    tt.style.top  = Math.min(e.clientY+14, window.innerHeight-140) + 'px';
  });
  el.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
});
</script>

</html>
